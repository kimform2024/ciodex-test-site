<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Test Site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .card {
      padding: 48px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 16px;
    }

    p {
      font-size: 20px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Codex 첫 배포 성공</h1>
    <p>GitHub와 Netlify가 정상 연결되었습니다.</p>
  </div>
</body>
</html>
